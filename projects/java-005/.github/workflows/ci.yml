name: ci

on:
  push:
    paths:
      - "projects/java-005/**"
  pull_request:
    paths:
      - "projects/java-005/**"

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: projects/java-005
    steps:
      - uses: actions/checkout@v4
      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"
          cache: maven
      - name: Verify (unit + integration + security tests, Testcontainers PostgreSQL)
        run: mvn -B verify
      - name: Static analysis (Checkstyle + SpotBugs)
        run: mvn -B verify -Pstatic-analysis -DskipTests
      - name: Package
        run: mvn -B -DskipTests package
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: workflow-orchestrator-jar
          path: projects/java-005/target/workflow-orchestrator-1.0.0.jar
