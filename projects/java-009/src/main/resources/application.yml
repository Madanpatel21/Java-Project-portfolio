spring:
  application:
    name: fleet-maintenance
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  shutdown: graceful

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8080}
      secret: ${JWT_SECRET:dev-only-please-rotate-this-secret-0123456789abcdef}
      ttl-minutes: ${JWT_TTL_MINUTES:30}
    lockout:
      max-attempts: 5
      lock-minutes: 15
  fleet:
    due-window-km: 1500
    forecast-horizon-km: 3000
    due-window-days: 7
    forecast-horizon-days: 14
  scheduler:
    enabled: ${SCHEDULER_ENABLED:true}
    forecast-cron: ${FORECAST_CRON:0 0/30 * * * ?}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
  seed:
    enabled: false
  rate-limit:
    auth-per-minute: 10
    verify-per-minute: 60
