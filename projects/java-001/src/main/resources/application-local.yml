# Full local production-like stack: PostgreSQL + Redis + RabbitMQ + Keycloak via docker-compose.
spring:
  datasource:
    url: jdbc:postgresql://${POSTGRES_HOST:localhost}:${POSTGRES_PORT:5432}/${POSTGRES_DB:workforce}
    username: ${POSTGRES_USER:workforce}
    password: ${POSTGRES_PASSWORD:workforce}
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}
  rabbitmq:
    host: ${RABBIT_HOST:localhost}
    port: ${RABBIT_PORT:5672}
    username: ${RABBIT_USER:workforce}
    password: ${RABBIT_PASSWORD:workforce}
  security:
    oauth2:
      resourceserver:
        jwt:
          issuer-uri: ${OIDC_ISSUER_URI:http://localhost:8081/realms/java700}

app:
  security:
    jwt:
      issuer: ${OIDC_ISSUER_URI:http://localhost:8081/realms/java700}
  messaging:
    enabled: true
  redis:
    enabled: true
  seed:
    enabled: false

logging:
  structured:
    format:
      console: ecs
  level:
    com.java700.workforce: INFO
