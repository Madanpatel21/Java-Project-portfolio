spring:
  application:
    name: workforce-compliance
  profiles:
    default: dev
  threads:
    virtual:
      enabled: true
  lifecycle:
    timeout-per-shutdown-phase: 20s
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          batch_size: 50
          time_zone: UTC
  flyway:
    enabled: true
    locations: classpath:db/migration
  jackson:
    default-property-inclusion: non_null

server:
  port: ${APP_PORT:8080}
  shutdown: graceful
  tomcat:
    max-swallow-size: 1MB
    threads:
      max: 400
  error:
    include-message: never

management:
  endpoints:
    web:
      exposure:
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when_authorized
      probes:
        enabled: true
  metrics:
    tags:
      application: workforce-compliance

springdoc:
  swagger-ui:
    path: /swagger-ui.html

app:
  security:
    jwt:
      issuer: ${JWT_ISSUER:http://localhost:8080}
      secret: ${JWT_SECRET:dev-only-please-rotate-this-secret-0123456789abcdef}
      ttl-minutes: ${JWT_TTL_MINUTES:30}
    lockout:
      max-attempts: 5
      lock-minutes: 15
    export:
      signing-key: ${EXPORT_SIGNING_KEY:dev-export-signing-key-change-me-0123456789}
      outbox-dir: ${EXPORT_OUTBOX_DIR:./data/exports}
  messaging:
    enabled: ${MESSAGING_ENABLED:false}
  redis:
    enabled: ${REDIS_ENABLED:false}
  seed:
    enabled: false
  correlation:
    enabled: true
    cron: "0 */5 * * * *"
    recert-interval-days: 90
  sweep:
    enabled: true
    fixed-delay-ms: 60000
  retention:
    access-events-days: 90
    export-files-days: 30
  rate-limit:
    ingest-per-minute: 120
    auth-per-minute: 10
