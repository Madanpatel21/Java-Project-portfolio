spring:
  datasource:
    url: jdbc:h2:mem:workforce-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  seed:
    enabled: false
  rate-limit:
    auth-per-minute: 100000
    ingest-per-minute: 100000
  correlation:
    enabled: false
  sweep:
    enabled: false
  security:
    export:
      signing-key: test-export-signing-key-0123456789abcdef
