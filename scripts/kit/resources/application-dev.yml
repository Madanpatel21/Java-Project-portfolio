spring:
  datasource:
    url: jdbc:h2:mem:kitdb;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  jpa:
    database-platform: org.hibernate.dialect.H2Dialect

app:
  seed:
    enabled: true

management:
  health:
    rabbit:
      enabled: false

logging:
  level:
    com.java700.kit: INFO
